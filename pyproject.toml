[project]
name = "axonry"
version = "0.1.0"
description = "axonry: a Bittensor subnet where AI agents improve a language model by editing its weights"
requires-python = ">=3.12"
dependencies = [
    "bittensor>=11.3,<12",
    "bittensor-wallet>=4.1.1",
]

[project.urls]
Homepage = "https://axonry.ai"
Repository = "https://github.com/AxOrganization/axonry"

[project.optional-dependencies]
orchestrator = [            # the owner's service: R2, and the benchmark items for owned evaluation hosts
    "boto3>=1.34",
    "datasets>=4.8",
]

[project.scripts]
axonry-orchestrator = "axonry.orchestrator.cli:main"
axonry-miner = "axonry.miner.cli:main"
axonry-validator = "axonry_validator.main:main"
axonry-review = "axonry.review.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["axonry", "axonry_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
