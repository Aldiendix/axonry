[project]
name = "axonry"
version = "0.1.0"
description = "Model-modify subnet: intake, rented GPU machines, agent runs, admission, evaluation, publication, validator"
requires-python = ">=3.12"
dependencies = [
    "bittensor>=11.3,<12",
    "bittensor-wallet>=4.1.1",
]

[project.optional-dependencies]
r2 = [
    "boto3>=1.34",
]

[project.scripts]
axonry-orchestrator = "axonry.orchestrator.cli:main"
axonry-miner = "axonry.miner.cli:main"
axonry-validator = "axonry_validator.main:main"
axonry-review = "axonry.review.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["axonry", "axonry_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
